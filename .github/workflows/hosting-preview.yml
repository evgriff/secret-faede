name: Hosting Preview

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

concurrency:
  group: hosting-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
      FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      VITE_ALLOWED_EMAILS: primary.gardener@example.com,partner.gardener@example.com
      VITE_APP_RUNTIME: mock
      VITE_ENABLE_PWA: false
    steps:
      - name: Check deploy configuration
        id: deploy-config
        run: |
          if [ -z "$FIREBASE_PROJECT_ID" ] || [ -z "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Preview deploy skipped because FIREBASE_PROJECT_ID or FIREBASE_SERVICE_ACCOUNT is missing."
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out code
        if: steps.deploy-config.outputs.enabled == 'true'
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        if: steps.deploy-config.outputs.enabled == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: steps.deploy-config.outputs.enabled == 'true'
        run: npm ci

      - name: Build app
        if: steps.deploy-config.outputs.enabled == 'true'
        run: npm run build

      - name: Deploy preview channel
        if: steps.deploy-config.outputs.enabled == 'true'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: ${{ secrets.FIREBASE_PROJECT_ID }}
          channelId: pr-${{ github.event.pull_request.number }}
