name: Hosting Live

on:
  push:
    branches:
      - main

concurrency:
  group: hosting-live
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    if: ${{ secrets.FIREBASE_PROJECT_ID != '' && secrets.FIREBASE_SERVICE_ACCOUNT != '' }}
    runs-on: ubuntu-latest
    environment: production
    env:
      VITE_ALLOWED_EMAILS: ${{ vars.VITE_ALLOWED_EMAILS }}
      VITE_APP_RUNTIME: firebase
      VITE_ENABLE_PWA: true
      VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
      VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
      VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
      VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}
      VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
      VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET }}
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate build env
        run: |
          test -n "$VITE_ALLOWED_EMAILS"
          test -n "$VITE_FIREBASE_API_KEY"
          test -n "$VITE_FIREBASE_APP_ID"
          test -n "$VITE_FIREBASE_AUTH_DOMAIN"
          test -n "$VITE_FIREBASE_MESSAGING_SENDER_ID"
          test -n "$VITE_FIREBASE_PROJECT_ID"
          test -n "$VITE_FIREBASE_STORAGE_BUCKET"

      - name: Build app
        run: npm run build

      - name: Deploy live channel
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: ${{ secrets.FIREBASE_PROJECT_ID }}
          channelId: live

  skipped:
    if: ${{ secrets.FIREBASE_PROJECT_ID == '' || secrets.FIREBASE_SERVICE_ACCOUNT == '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Explain skip
        run: |
          echo "Live deploy skipped because FIREBASE_PROJECT_ID or FIREBASE_SERVICE_ACCOUNT is missing."
