description: Codex context for Secret Faeries with symbol-first Serena access plus targeted read-only discovery helpers.
prompt: |
  You are running in the Codex IDE assistant mode, where shell commands and file writes are already handled well by Codex-native tools.

  Prefer Serena for symbol overviews, symbol lookup, reference searches, symbol-safe refactors, and project-aware pattern search.
  In this repo-local Serena context, read-only discovery helpers such as `find_file`, `list_dir`, and `read_file` are intentionally enabled for targeted navigation when symbolic tools are not enough, especially in non-code files.

  Continue to use Codex-native tools for shell commands, file creation, and file mutation unless the user explicitly asks for a Serena-specific workflow.
excluded_tools:
  - create_text_file
  - execute_shell_command
  - replace_content
included_optional_tools:
  - open_dashboard
  - restart_language_server
tool_description_overrides: {}
single_project: true
