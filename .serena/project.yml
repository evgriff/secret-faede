# Project configuration for Serena.
# See https://oraios.github.io/serena/02-usage/040_workflow.html
project_name: 'secret-faeries'

languages: ['typescript']
encoding: 'utf-8'
line_ending: 'lf'
language_backend: 'LSP'
ignore_all_files_in_gitignore: true
ls_specific_settings: {}
ignored_paths:
  - 'dist/**'
  - 'coverage/**'
  - 'output/**'
  - 'playwright-report/**'
  - 'test-results/**'
  - '.firebase/**'
  - '.serena/cache/**'
  - '.serena/logs/**'
  - 'src/domain/crops/homeGardenCropCatalog.generated.json'
read_only: false

excluded_tools: []
included_optional_tools: []
fixed_tools: []
base_modes:
  - 'query-projects'
default_modes:

initial_prompt: |
  Secret Faeries is a small, functionality-first garden plot planner and garden operations app.
  Preserve password auth for the two provisioned accounts, one shared published garden workspace, and private per-user drafts.
  Keep product scope centered on the real plot editor and practical operations; do not add dashboards, charts, maps, collaboration, lore, AI, carrier messaging, or onboarding flows.
  Keep seams explicit: AuthService owns auth, GardenRepository owns garden persistence, and UserProfileRepository owns profile preferences.
  Store garden positions in feet using xFt from the left edge and yFt from the top edge; never store raw pixels as canonical garden coordinates.
  Start every agentic workflow with git status --short --branch, confirm the branch, keep agent work on main unless the user explicitly asks for another branch strategy, and stop for confirmation if the active branch is not main.
  Treat pre-existing dirty files as user-owned, keep edits scoped, stage only explicit files when asked, and commit only when the user asks.
  Use Serena first for code navigation, symbol overviews, references, and symbol-safe refactors.
  This repo-local Serena setup also enables read-only discovery helpers plus query-projects mode; use them selectively when symbolic tools are not enough.
  Keep shell commands and file writes in Codex-native tools unless the user explicitly wants a Serena-specific recovery flow such as restarting the language server.

symbol_info_budget: 10
read_only_memory_patterns: []
ignored_memory_patterns:
  - '_archive/.*'
